# ─────────────────────────────────────────────────────────────
#  Manual bump of Casks/sam.rb against richhabits/sam releases.
#
#  WHY THIS LIVES HERE, and not in richhabits/sam. The release workflow over there has a step
#  that pushes this cask, but it needs a cross-repo PAT (HOMEBREW_TAP_TOKEN) to write to this
#  repo — and when that secret is missing the step just skips.
#
#  Hourly cron is OFF. SAM 3.7.0 is Apple Silicon only (no Intel DMG). The old job required
#  both hashes in SHA256SUMS.txt, failed every hour, and left the cask stuck on 3.5.0.
#  The live cask is: arm → 3.7.0, intel → last Intel build 3.5.0. Do not auto-write an
#  Intel URL that does not exist. Bump by hand (workflow_dispatch) when a new *pair* of
#  Mac DMGs ships, or edit Casks/sam.rb directly.
# ─────────────────────────────────────────────────────────────
name: Bump SAM cask

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-cask
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bump the cask if upstream shipped both Mac DMGs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: richhabits/sam
        run: |
          set -euo pipefail

          TAG="$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)"
          V="${TAG#v}"
          CUR="$(sed -n 's/^[[:space:]]*version "\(.*\)"$/\1/p' Casks/sam.rb | head -1)"
          echo "upstream=$V  cask=$CUR"

          if [ "$V" = "$CUR" ]; then
            echo "✓ already at $V — nothing to do"
            exit 0
          fi

          # Prefer SHA256SUMS.txt. 3.7.0 did not attach one with both Mac DMGs — refuse a
          # half-written Intel URL rather than shipping a cask that 404s on Intel.
          gh release download "$TAG" -R "$UPSTREAM" -p 'SHA256SUMS.txt' --clobber || true

          ARM=""
          INTEL=""
          if [ -f SHA256SUMS.txt ]; then
            ARM="$(grep -iE "arm64\.dmg" SHA256SUMS.txt | grep -oiE '[a-f0-9]{64}' | head -1 || true)"
            INTEL="$(grep -iE "SAM-${V}\.dmg" SHA256SUMS.txt | grep -oiE '[a-f0-9]{64}' | head -1 || true)"
          fi

          if [ -z "$ARM" ] || [ -z "$INTEL" ]; then
            echo "::notice title=Cask NOT auto-bumped::$TAG has no Intel DMG (or no SHA256SUMS). Edit Casks/sam.rb by hand — arm-only current, keep last Intel version. Not a failure of the tap."
            exit 0
          fi

          cat > Casks/sam.rb <<CASK
          cask "sam" do
            version "${V}"
            on_arm do
              sha256 "${ARM}"
              url "https://github.com/${UPSTREAM}/releases/download/v#{version}/SAM-#{version}-arm64.dmg"
            end
            on_intel do
              sha256 "${INTEL}"
              url "https://github.com/${UPSTREAM}/releases/download/v#{version}/SAM-#{version}.dmg"
            end
            name "SAM"
            desc "Free, private, local-first AI assistant that actually does the work"
            homepage "https://github.com/${UPSTREAM}"
            app "SAM.app"
          end
          CASK

          rm -f SHA256SUMS.txt

          git config user.name  "sam-bot"
          git config user.email "sam@hectic"
          git add Casks/sam.rb
          git commit -m "sam ${V}"
          git push
          echo "✓ cask bumped ${CUR:-none} → ${V}"
