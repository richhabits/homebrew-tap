# ─────────────────────────────────────────────────────────────
#  Keep Casks/sam.rb pointing at the latest SAM release.
#
#  WHY THIS LIVES HERE, and not in richhabits/sam. The release workflow over there has a step
#  that pushes this cask, but it needs a cross-repo PAT (HOMEBREW_TAP_TOKEN) to write to this
#  repo — and when that secret is missing the step just skips. It skipped for six months: the
#  cask sat at v1.5.0 while SAM shipped v3.1.1, so `brew install --cask richhabits/tap/sam`
#  handed people a build from another era, and every single release still looked green.
#
#  A workflow that lives in the repo it writes to needs no PAT at all — the built-in
#  GITHUB_TOKEN can commit here. richhabits/sam is public, so reading its releases needs no
#  auth either. Nothing to provision, nothing to rotate, nothing to forget.
#
#  Hourly rather than on-release, for the same reason: an on-release trigger would need the
#  upstream repo to hold a token for this one. A new release is live in the tap within the hour
#  and nobody has to remember anything.
# ─────────────────────────────────────────────────────────────
name: Bump SAM cask

on:
  schedule:
    - cron: "17 * * * *"     # hourly, off the hour — the top of the hour is the busiest queue
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bump-cask
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Bump the cask if upstream is ahead
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPSTREAM: richhabits/sam
        run: |
          set -euo pipefail

          TAG="$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)"
          V="${TAG#v}"
          CUR="$(sed -n 's/^[[:space:]]*version "\(.*\)"$/\1/p' Casks/sam.rb | head -1)"
          echo "upstream=$V  cask=$CUR"

          if [ "$V" = "$CUR" ]; then
            echo "✓ already at $V — nothing to do"
            exit 0
          fi

          # The release publishes SHA256SUMS.txt. Take the hashes from it rather than
          # re-downloading ~370MB of disk images just to compute what is already published.
          gh release download "$TAG" -R "$UPSTREAM" -p 'SHA256SUMS.txt' --clobber

          ARM="$(grep -iE "arm64\.dmg" SHA256SUMS.txt | grep -oiE '[a-f0-9]{64}' | head -1 || true)"
          INTEL="$(grep -iE "SAM-${V}\.dmg" SHA256SUMS.txt | grep -oiE '[a-f0-9]{64}' | head -1 || true)"

          # Refuse to write a cask we cannot fully verify. A cask with a wrong or empty sha256
          # fails at install time for every user, which is worse than staying one version behind.
          if [ -z "$ARM" ] || [ -z "$INTEL" ]; then
            echo "::error title=Cask NOT bumped::$TAG published SHA256SUMS.txt without both mac dmg hashes (arm64='$ARM' intel='$INTEL'). Leaving the cask at $CUR rather than writing one that fails to install."
            exit 1
          fi

          cat > Casks/sam.rb <<CASK
          cask "sam" do
            version "${V}"
            on_arm do
              sha256 "${ARM}"
              url "https://github.com/${UPSTREAM}/releases/download/v#{version}/SAM-#{version}-arm64.dmg"
            end
            on_intel do
              sha256 "${INTEL}"
              url "https://github.com/${UPSTREAM}/releases/download/v#{version}/SAM-#{version}.dmg"
            end
            name "SAM"
            desc "Free, private, local-first AI assistant that actually does the work"
            homepage "https://github.com/${UPSTREAM}"
            app "SAM.app"
          end
          CASK

          rm -f SHA256SUMS.txt

          git config user.name  "sam-bot"
          git config user.email "sam@hectic"
          git add Casks/sam.rb
          git commit -m "sam ${V}"
          git push
          echo "✓ cask bumped ${CUR:-none} → ${V}"
